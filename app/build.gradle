plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.outofandroid'
    compileSdk 34

    defaultConfig {
        applicationId "com.outofandroid"
        minSdk 26
        targetSdk 34
        // A growing versionCode lets every new build install over the previous one
        // (Android refuses to install a lower versionCode). It counts 10-minute steps
        // since 2025-01-01, so local and CI builds stay in the same order.
        def runNumber = System.getenv("GITHUB_RUN_NUMBER")
        versionCode = (int) ((System.currentTimeMillis() - 1735689600000L) / 600000L)
        versionName = runNumber ? "1.0.${runNumber}" : "1.0-local"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Signing. Before this, release APKs were published unsigned and every CI run
    // signed debug APKs with a new random key, so Android refused to install or
    // update them with "App not installed". Now debug and release share one key,
    // read from keystore.properties (local, not in git) or SIGNING_* env vars (CI).
    // With neither present, release falls back to the debug key so it is never unsigned.
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file("keystore.properties")
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def signingValue = { String prop, String env -> System.getenv(env) ?: keystoreProps.getProperty(prop) }
    def sharedStoreFile = signingValue("storeFile", "SIGNING_KEYSTORE_FILE")
    def hasSharedKey = sharedStoreFile != null && rootProject.file(sharedStoreFile).exists()

    signingConfigs {
        if (hasSharedKey) {
            shared {
                storeFile rootProject.file(sharedStoreFile)
                storePassword signingValue("storePassword", "SIGNING_STORE_PASSWORD")
                keyAlias signingValue("keyAlias", "SIGNING_KEY_ALIAS")
                keyPassword signingValue("keyPassword", "SIGNING_KEY_PASSWORD")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            if (hasSharedKey) signingConfig signingConfigs.shared
        }
        release {
            signingConfig hasSharedKey ? signingConfigs.shared : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}